name: Side Button Seek
description: Use the mouse side buttons (X1 / browser back and X2 / browser forward) to seek the scene player backwards and forwards. Blocks browser-level back/forward navigation via the Navigation API, and adds a control-bar button to set the seek step instantly.
version: 2.1.1
url: https://github.com/bslnssb/sideButtonSeek

ui:
  javascript:
    - sideButtonSeek.js

settings:
  seekSeconds:
    displayName: Seek step (seconds)
    description: "Seconds to jump on each side-button press. Default: 10. Changes apply after a page refresh (or call SideButtonSeek.reload())."
    type: NUMBER

  swapButtons:
    displayName: Swap the two side buttons
    description: "Reverse which button seeks backwards and which seeks forwards."
    type: BOOLEAN

  onlyInPlayer:
    displayName: Only act over the video player
    description: "When enabled, side buttons keep their normal behaviour everywhere else in the Stash UI."
    type: BOOLEAN

  showOsd:
    displayName: Show on-screen feedback
    description: "Briefly display the jump amount (e.g. +10s) over the video."
    type: BOOLEAN

  showStepButton:
    displayName: Show seek-step button on the player
    description: "Show a small ±Ns button in the top-right corner of the video. Click it to change how many seconds each side-button press jumps; the value is saved to the plugin settings."
    type: BOOLEAN

  preventNavigation:
    displayName: Block browser back/forward navigation
    description: "Cancel the browser-level back/forward traversal with the Navigation API (Chrome/Edge 102+) and preventDefault() on side-button events. Turn off to keep normal browser navigation."
    type: BOOLEAN

  debug:
    displayName: Debug logging
    description: "Log side-button events and seek results to the browser console."
    type: BOOLEAN
